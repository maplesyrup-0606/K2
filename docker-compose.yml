services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      FRONTEND_URL: https://goon-pod.tail26570e.ts.net
      OAUTH_REDIRECT_URI: https://goon-pod.tail26570e.ts.net/api/auth/google/callback
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./backend/app.db:/app/app.db
      - ./backend/media:/app/media

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/media:/usr/share/nginx/media:ro
    depends_on:
      - backend
